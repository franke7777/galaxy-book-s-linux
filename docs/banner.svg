<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Linux on the Samsung Galaxy Book S (Intel Lakefield)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181825"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#313244"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9399b2"/>
      <stop offset="1" stop-color="#585b70"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cba6f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <circle cx="1000" cy="210" r="300" fill="url(#halo)"/>

  <!-- text -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="128" font-size="22" fill="#a6adc8" letter-spacing="3">SAMSUNG GALAXY BOOK S · INTEL LAKEFIELD</text>
    <text x="68" y="198" font-size="64" font-weight="700" fill="#cdd6f4">Linux runs here.</text>
    <text x="70" y="244" font-size="24" fill="#bac2de">Arch Linux from the internal eUFS, with patches</text>
    <text x="70" y="276" font-size="24" fill="#bac2de">and services for what a stock kernel can't drive.</text>
  </g>

  <!-- status chips -->
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="17">
    <g transform="translate(70,316)">
      <rect width="92" height="34" rx="17" fill="#a6e3a1" fill-opacity="0.16" stroke="#a6e3a1" stroke-opacity="0.6"/>
      <text x="46" y="23" text-anchor="middle" fill="#a6e3a1">eUFS</text>
    </g>
    <g transform="translate(172,316)">
      <rect width="80" height="34" rx="17" fill="#a6e3a1" fill-opacity="0.16" stroke="#a6e3a1" stroke-opacity="0.6"/>
      <text x="40" y="23" text-anchor="middle" fill="#a6e3a1">GPU</text>
    </g>
    <g transform="translate(262,316)">
      <rect width="96" height="34" rx="17" fill="#a6e3a1" fill-opacity="0.16" stroke="#a6e3a1" stroke-opacity="0.6"/>
      <text x="48" y="23" text-anchor="middle" fill="#a6e3a1">audio</text>
    </g>
    <g transform="translate(368,316)">
      <rect width="80" height="34" rx="17" fill="#a6e3a1" fill-opacity="0.16" stroke="#a6e3a1" stroke-opacity="0.6"/>
      <text x="40" y="23" text-anchor="middle" fill="#a6e3a1">mic</text>
    </g>
    <g transform="translate(458,316)">
      <rect width="112" height="34" rx="17" fill="#a6e3a1" fill-opacity="0.16" stroke="#a6e3a1" stroke-opacity="0.6"/>
      <text x="56" y="23" text-anchor="middle" fill="#a6e3a1">battery</text>
    </g>
    <g transform="translate(70,360)">
      <rect width="72" height="34" rx="17" fill="#a6e3a1" fill-opacity="0.16" stroke="#a6e3a1" stroke-opacity="0.6"/>
      <text x="36" y="23" text-anchor="middle" fill="#a6e3a1">lid</text>
    </g>
    <g transform="translate(152,360)">
      <rect width="130" height="34" rx="17" fill="#a6e3a1" fill-opacity="0.16" stroke="#a6e3a1" stroke-opacity="0.6"/>
      <text x="65" y="23" text-anchor="middle" fill="#a6e3a1">backlight</text>
    </g>
    <g transform="translate(292,360)">
      <rect width="130" height="34" rx="17" fill="#a6e3a1" fill-opacity="0.16" stroke="#a6e3a1" stroke-opacity="0.6"/>
      <text x="65" y="23" text-anchor="middle" fill="#a6e3a1">bluetooth</text>
    </g>
    <g transform="translate(432,360)">
      <rect width="138" height="34" rx="17" fill="#f38ba8" fill-opacity="0.12" stroke="#f38ba8" stroke-opacity="0.55"/>
      <text x="69" y="23" text-anchor="middle" fill="#f38ba8">camera ✗</text>
    </g>
  </g>

  <!-- laptop -->
  <g transform="translate(760,70)">
    <!-- lid / bezel -->
    <rect x="0" y="0" width="460" height="290" rx="16" fill="#11111b" stroke="url(#glow)" stroke-width="2.5"/>
    <rect x="14" y="14" width="432" height="262" rx="6" fill="url(#screen)"/>
    <!-- webcam dot -->
    <circle cx="230" cy="8" r="2.5" fill="#45475a"/>

    <!-- bar -->
    <rect x="22" y="22" width="416" height="20" rx="10" fill="#181825"/>
    <circle cx="36" cy="32" r="4" fill="#cba6f7"/>
    <rect x="48" y="28" width="38" height="8" rx="4" fill="#45475a"/>
    <rect x="332" y="27" width="22" height="10" rx="5" fill="#a6e3a1" fill-opacity="0.7"/>
    <rect x="360" y="27" width="22" height="10" rx="5" fill="#f9e2af" fill-opacity="0.7"/>
    <rect x="388" y="27" width="40" height="10" rx="5" fill="#89b4fa" fill-opacity="0.7"/>

    <!-- tiled windows -->
    <rect x="22" y="50" width="228" height="218" rx="8" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1.5"/>
    <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11.5">
      <text x="34" y="74" fill="#a6e3a1">$ uname -r</text>
      <text x="34" y="92" fill="#cdd6f4">7.2.9-arch1-1</text>
      <text x="34" y="116" fill="#a6e3a1">$ glxinfo -B | grep renderer</text>
      <text x="34" y="134" fill="#cdd6f4">Mesa Intel UHD (JSL)</text>
      <text x="34" y="158" fill="#a6e3a1">$ upower -i BAT1 | grep state</text>
      <text x="34" y="176" fill="#cdd6f4">state: charging</text>
      <text x="34" y="192" fill="#cdd6f4"> </text>
      <text x="34" y="216" fill="#a6e3a1">$ ls /dev/video*</text>
      <text x="34" y="234" fill="#f38ba8">no such file :(</text>
      <rect x="34" y="244" width="8" height="13" fill="#cdd6f4"/>
    </g>
    <rect x="258" y="50" width="180" height="104" rx="8" fill="#1e1e2e" stroke="#45475a" stroke-width="1.2"/>
    <!-- mini chart in right-top window -->
    <polyline points="272,138 292,120 312,126 332,100 352,108 372,84 392,92 418,70" fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="272" y="62" width="60" height="7" rx="3.5" fill="#45475a"/>
    <rect x="258" y="162" width="180" height="106" rx="8" fill="#1e1e2e" stroke="#45475a" stroke-width="1.2"/>
    <!-- equalizer bars = audio -->
    <g fill="#cba6f7" fill-opacity="0.85">
      <rect x="276" y="222" width="12" height="32" rx="3"/>
      <rect x="296" y="200" width="12" height="54" rx="3"/>
      <rect x="316" y="212" width="12" height="42" rx="3"/>
      <rect x="336" y="190" width="12" height="64" rx="3"/>
      <rect x="356" y="206" width="12" height="48" rx="3"/>
      <rect x="376" y="196" width="12" height="58" rx="3"/>
      <rect x="396" y="216" width="12" height="38" rx="3"/>
      <rect x="416" y="226" width="12" height="28" rx="3"/>
    </g>
    <rect x="272" y="174" width="70" height="7" rx="3.5" fill="#45475a"/>

    <!-- base -->
    <path d="M-34 300 L494 300 L470 318 Q466 322 456 322 L4 322 Q-6 322 -10 318 Z" fill="url(#body)"/>
    <rect x="190" y="300" width="80" height="6" rx="3" fill="#45475a"/>
  </g>
</svg>
