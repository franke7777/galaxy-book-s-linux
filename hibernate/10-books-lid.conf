# /etc/systemd/logind.conf.d/10-books-lid.conf
# Galaxy Book S: no wake timer (acpi-tad without alarm) -> no suspend-then-hibernate.
# On battery: logind does nothing, books-lidwait locks and hibernates after 20 min.
# On AC: suspend (s2idle, wakes instantly).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
