# Hardware-related lines for the Sway config (include it or copy the lines).
# Scripts from extras/ are expected in ~/.local/bin, daemons in /usr/local/bin.

# Lock before every suspend (lid closed), -w waits until swaylock is up.
# Idle: 5 min screen off, 10 min lock, 20 min hibernate on battery.
exec swayidle -w \
         timeout 300 '~/.local/bin/books-idle dim' resume '~/.local/bin/books-idle wake' \
         timeout 600 'swaylock -f' \
         timeout 1200 '~/.local/bin/books-idle rest' resume '~/.local/bin/books-idle stop' \
         before-sleep 'swaylock -f' \
         lock 'swaylock -f'

# On-screen indicators
exec swayosd-server

# Volume
bindsym --locked XF86AudioMute exec swayosd-client --output-volume mute-toggle
bindsym --locked XF86AudioLowerVolume exec swayosd-client --output-volume -5 --max-volume 100
bindsym --locked XF86AudioRaiseVolume exec swayosd-client --output-volume +5 --max-volume 100
bindsym --locked XF86AudioMicMute exec swayosd-client --input-volume mute-toggle

# Brightness: books-backlight (GPU PWM register, no i915 display)
bindsym --locked XF86MonBrightnessDown exec ~/.local/bin/bl-osd -2
bindsym --locked XF86MonBrightnessUp exec ~/.local/bin/bl-osd +2

# Keyboard backlight: Fn+F9 arrives via books-fnkeysd as XF86KbdLightOnOff, Super+F9 as fallback
bindsym --locked XF86KbdLightOnOff exec ~/.local/bin/kbd-osd
bindsym --locked $mod+F9 exec ~/.local/bin/kbd-osd

# Touchpad
input type:touchpad {
    tap enabled
    natural_scroll enabled
}

# Built-in microphone gain (node name changes per boot)
exec ~/.local/bin/books-mic-gain
