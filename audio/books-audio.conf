# /etc/modprobe.d/books-audio.conf
# Galaxy Book S (Lakefield, HDA 8086:98c8, codec Realtek ALC298, subsystem 144d:c18b)
# AVS DSP driver instead of plain HDA, so that the built-in microphone (DMIC on the DSP) works.
# Firmware: Windows SST 10.28.0.7068 at /lib/firmware/updates/intel/avs/lkf/dsp_basefw.bin
# (the linux-firmware file 10.28.0.12823 is rejected by the CSE, lec 0x2c). Details: ../microphone/README.md
#
# Without the microphone (no Windows firmware), use the plain HDA driver instead:
#   options snd_intel_dspcfg dsp_driver=1
#   options snd_hda_intel position_fix=1 power_save=0
# and enable books-hda.service.
options snd_intel_dspcfg dsp_driver=4
