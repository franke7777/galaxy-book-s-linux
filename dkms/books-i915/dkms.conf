PACKAGE_NAME="books-i915"
PACKAGE_VERSION="1.0"
# Lakefield GPU (8086:9840) as a render-only GPU (Elkhart Lake profile), display stays on simpledrm
PRE_BUILD="prebuild.sh $kernelver"
MAKE[0]="make -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build/i915 CONFIG_DRM_I915=m -j$(nproc) modules"
CLEAN="true"
BUILT_MODULE_NAME[0]="i915"
BUILT_MODULE_LOCATION[0]="i915/"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
